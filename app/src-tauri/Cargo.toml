[package]
name = "offhand-app"
description = "Offhand desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "offhand_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
# The Windows test harness for a Tauri lib can fail to start (missing manifest/WebView2 DLL
# resolution), so the lib has no tests of its own.
test = false
doctest = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
offhand-core = { path = "../../crates/offhand-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

