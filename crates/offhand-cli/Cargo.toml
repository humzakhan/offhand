[package]
name = "offhand-cli"
description = "Offhand command-line interface"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "offhand"
path = "src/main.rs"

[dependencies]
offhand-core = { path = "../offhand-core" }
clap = { version = "4", features = ["derive"] }
offhand-platform = { path = "../offhand-platform" }
offhand-infer = { path = "../offhand-infer" }
ctrlc = "3"

[target.'cfg(target_os = "macos")'.dependencies]
offhand-macos = { path = "../offhand-macos" }

[target.'cfg(target_os = "windows")'.dependencies]
offhand-windows = { path = "../offhand-windows" }
