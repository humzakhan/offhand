[package]
name = "offhand-infer"
description = "Inference engine interface for Offhand"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
offhand-platform = { path = "../offhand-platform" }
thiserror = "2"
dirs = { version = "6", optional = true }
llama-cpp-2 = { version = "=0.1.160", default-features = false, optional = true }

[features]
default = []
embed-llama = ["dep:dirs", "dep:llama-cpp-2"]
