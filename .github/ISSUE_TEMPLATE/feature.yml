name: Feature request
description: Suggest a new capability or change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: checkboxes
    id: platforms
    attributes:
      label: Platforms affected
      options:
        - label: macOS
        - label: Windows
