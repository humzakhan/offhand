# Model weights that Offhand can download on first run.
# Weights are never committed. `cargo xtask fetch-model <id>` reads this file.
# Fill in sha256 and size after the week-2 benchmark picks the files (ADR-0002).

[[model]]
id = "qwen3.5-4b"
role = "default"
repo = "Qwen/Qwen3.5-4B"
file = "TBD (GGUF Q4_K_M + mmproj)"
sha256 = "TBD"
license = "Apache-2.0"

[[model]]
id = "embeddinggemma-300m"
role = "optional label embedder (v0.2)"
# https://huggingface.co/ggml-org/embeddinggemma-300M-GGUF
repo = "ggml-org/embeddinggemma-300M-GGUF"
file = "embeddinggemma-300M-Q8_0.gguf"
# Verify the selected artifact and pin its SHA-256 before enabling downloads.
